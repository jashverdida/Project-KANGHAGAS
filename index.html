<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project KANGHAGAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeae3;--card:#faf7f2;--ink:#2d2427;--mute:#7c706b;--line:#e2d8cb;--a:#7a3b49;--sage:#6f9179;--gold:#b99a63;
--grad:linear-gradient(125deg,#6d3442 0%,#8a5a64 55%,#b49a73 100%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171315;--card:#221c1f;--ink:#f0e8e3;--mute:#a89b95;--line:#3a2f33}}
:root[data-theme="dark"]{--bg:#171315;--card:#221c1f;--ink:#f0e8e3;--mute:#a89b95;--line:#3a2f33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 'Nunito Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:700}
header{background:var(--grad);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:50%;background:#fff center/cover}
header h1{font-size:23px}header small{display:block;opacity:.85;font-size:12px}
.sw{margin-left:auto;display:flex;background:rgba(0,0,0,.22);border-radius:99px;padding:3px}
.sw button{border:0;background:none;color:#fff;padding:7px 16px;border-radius:99px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.sw button.on{background:#fff;color:#6d3442}
.wrap{display:grid;grid-template-columns:225px 1fr;gap:22px;max-width:1120px;margin:0 auto;padding:22px 16px 90px}
nav{display:flex;flex-direction:column;gap:3px;align-self:start;position:sticky;top:12px}
nav button{display:flex;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:10px 12px;border-radius:12px;font:600 14.5px 'Nunito Sans',sans-serif;cursor:pointer}
nav button:hover{background:var(--line)}nav button.on{background:var(--a);color:#fff}
nav .dot{margin-left:auto;font-size:11px;background:var(--gold);color:#2d2427;border-radius:99px;padding:0 7px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--grad);color:#fff;border-radius:20px;padding:26px;margin-bottom:16px}
.hero h2{font-size:28px;max-width:520px}.hero p{max-width:470px;opacity:.9;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.card h3{font-size:19px;margin-bottom:4px}.mute{color:var(--mute);font-size:13px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:10px 20px;font:700 15px 'Nunito Sans',sans-serif;cursor:pointer;background:var(--a);color:#fff}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:9px}.btn.red{background:#a8394c}
.pill{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:700;text-transform:capitalize}
.pill.pending{background:#f3e6c8;color:#6b531c}.pill.ready,.pill.available{background:#d8e8dc;color:#2f5a3d}
.pill.rejected,.pill.onleave{background:#f1d9dc;color:#7d2a37}.pill.processing,.pill.inclass{background:#e3dcef;color:#473a73}.pill.onbreak{background:#ece4d3;color:#5e4d2a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:6px}
.hero-pick{display:flex;align-items:center;gap:12px;height:84px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;cursor:pointer;background:var(--bg);color:var(--ink);font:inherit;text-align:left;width:100%}
.hero-pick:hover{border-color:var(--sage)}.hero-pick.on,.pick.on{border-color:var(--a);background:var(--card);box-shadow:0 0 0 3px rgba(122,59,73,.22)}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:linear-gradient(140deg,#e7d9c3,#cfdccf)}
.hero-pick b{display:block;font-size:13.5px;line-height:1.25}.hero-pick span{font-size:12px;color:var(--mute)}
.pick{border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;background:var(--bg);color:var(--ink);font:600 14px inherit;font-family:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font:700 32px Fraunces,serif;color:var(--a)}
.ann{border-left:4px solid var(--sage);padding:3px 0 3px 14px;margin:14px 0}.ann.pin{border-color:var(--gold)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-size:13px}
details{border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;background:var(--card)}
summary{font-weight:700;cursor:pointer}details p,details ul{margin:8px 0 0;color:var(--mute)}
.banner{padding:11px 16px;border-radius:12px;margin-bottom:14px;font-weight:700}
.banner.open{background:#d8e8dc;color:#2f5a3d}.banner.closed{background:#f1d9dc;color:#7d2a37}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--sage);background:var(--card)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rate{display:flex;gap:8px}.rate button{font-size:26px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:4px 10px;cursor:pointer}.rate button.on{border-color:var(--a);background:var(--card)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
.soon{text-align:center;padding:46px 10px}.soon .big{font:700 52px Fraunces,serif;color:var(--a)}
#bot{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20}
#botBtn{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--sage);color:#fff;padding:8px 16px 8px 8px;font:700 14px 'Nunito Sans',sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#botBtn i{font-style:normal;font-size:26px;background:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
#botBox{display:none;position:absolute;right:0;bottom:60px;width:min(340px,calc(100vw - 36px));background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.25)}
#botBox.show{display:block}#botBox h3{background:var(--grad);color:#fff;padding:12px 16px;font-size:16px}
#msgs{height:250px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px}.m.b{background:var(--bg);align-self:flex-start}.m.u{background:var(--a);color:#fff;align-self:flex-end}
#qs{padding:0 12px 8px;max-height:96px;overflow-y:auto}#qs .pick{font-size:12.5px;padding:5px 10px;border-radius:99px}
#botIn{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.xmb{position:relative;height:580px;border-radius:24px;overflow:hidden;color:#fff;background:radial-gradient(circle at 18% 8%,rgba(140,70,95,.55),transparent 55%),radial-gradient(circle at 90% 90%,rgba(111,145,121,.35),transparent 50%),linear-gradient(160deg,#171013,#2a1c25 55%,#1a2622)}
.xmb svg{position:absolute;left:0;bottom:-20px;pointer-events:none}
.xw1{animation:drift 18s linear infinite}.xw2{animation:drift 26s linear infinite reverse}.xw3{animation:drift 36s linear infinite}
@keyframes drift{to{transform:translateX(-600px)}}@keyframes fin{from{opacity:0;transform:translateY(10px)}}
@keyframes phc{0%{opacity:0;transform:translateY(8px)}6%,22%{opacity:1;transform:none}28%,100%{opacity:0}}
.xtop{position:absolute;left:clamp(36px,6vw,90px);right:clamp(36px,6vw,90px);top:28px;display:flex;justify-content:space-between;gap:12px}
.xbrand{font:700 24px Fraunces,serif}.xph{position:relative;height:22px;width:420px;max-width:60vw;font-size:14px;opacity:.85;margin-top:4px}
.ph{position:absolute;left:0;top:0;opacity:0;animation:phc 16s infinite}.ph:first-child{opacity:1}
.ph:nth-child(2){animation-delay:4s}.ph:nth-child(3){animation-delay:8s}.ph:nth-child(4){animation-delay:12s}
.xclk{text-align:right;font:600 22px 'Nunito Sans',sans-serif}.xclk small{display:block;font-size:12px;font-weight:400;opacity:.7}
.xcats{position:absolute;top:22vh;left:clamp(40px,10vw,160px);display:flex;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.xc{width:120px;flex:none;text-align:center;opacity:.5;cursor:pointer;background:none;border:0;color:#fff;font:600 13px 'Nunito Sans',sans-serif;transition:.4s}
.xc.on{opacity:1;transform:scale(1.2)}
.xc i{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 6px;border-radius:50%;font-style:normal;font-size:28px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.xc.on i{box-shadow:0 0 30px rgba(255,255,255,.35)}
.xitems{position:absolute;left:calc(clamp(40px,10vw,160px) - 20px);top:calc(22vh + 132px);right:30px;display:flex;flex-direction:column;gap:4px;animation:fin .6s}
.xi{display:flex;gap:12px;align-items:flex-start;background:none;border:0;color:#fff;text-align:left;padding:8px 12px;border-radius:12px;opacity:.55;font:600 17px 'Nunito Sans',sans-serif;cursor:pointer;transition:.35s}
.xi.on{opacity:1;font-size:21px;background:linear-gradient(90deg,rgba(255,255,255,.15),transparent)}
.xi .d{display:none;font-weight:400;font-size:13.5px;opacity:.85}.xi.on .d{display:block;animation:fin .7s}
.xhint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;opacity:.5}
@media(max-width:760px){.xmb{height:540px}.xcats{left:20px}.xc{width:92px}.xitems{left:12px}.xph{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
body.landing header{display:none}body.landing .wrap{max-width:none;padding:0;display:block}body.landing .xmb{height:100vh;height:100dvh;border-radius:0}
.xmenu{top:30vh}.xmenu .xi{font-size:24px}.xmenu .xi.on{font-size:30px}
.xfeat{position:absolute;right:clamp(40px,8vw,140px);top:20vh;display:flex;flex-direction:column;gap:2.6vh;list-style:none;margin:0;padding:0}
.xfeat li{margin-left:var(--o);white-space:nowrap;color:#fff;opacity:calc(1 - var(--i)*.06);font:italic 600 clamp(20px,2.4vw,30px) Fraunces,Georgia,serif;animation:fin 1s both,bob 7s ease-in-out infinite;animation-delay:calc(var(--i)*.25s),calc(var(--i)*-1s)}
.xfeat li:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:12px;vertical-align:middle}
@keyframes bob{50%{translate:0 -8px}}
@media(max-width:760px){.xfeat{right:auto;left:26px;top:auto;bottom:56px;gap:1.2vh}.xfeat li{font-size:17px}.xmenu{top:22vh}.xhint{display:none}}
body.landing{background:#171013}
.lp{color:#fff;background:linear-gradient(170deg,#171013,#2a1c25 45%,#1a2622);overflow-x:clip}
.lp-nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:22px;padding:12px clamp(20px,6vw,90px);background:rgba(23,16,19,.65);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.lp-logo{width:38px;height:38px;border-radius:50%;background:#fff center/cover;flex:none}.lp-nav b{font:700 20px Fraunces,serif}
.lp-nav a{color:#fff;opacity:.75;cursor:pointer;font-weight:600;font-size:14px;background:none;border:0;font-family:inherit}.lp-nav a:hover{opacity:1}
.lp-sp{margin-left:auto;display:flex;gap:10px}
.lp .btn{padding:12px 24px}.lp .btn.sm{padding:7px 16px}.lp .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.lp .btn:not(.ghost){background:linear-gradient(120deg,#e8c98f,#c9a45c);color:#2d2427}
.lp-hero{position:relative;overflow:hidden;min-height:calc(100vh - 62px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;padding:60px clamp(20px,6vw,90px) 120px;background:radial-gradient(circle at 15% 15%,rgba(140,70,95,.45),transparent 50%),radial-gradient(circle at 85% 80%,rgba(111,145,121,.3),transparent 50%)}
.lp-hero svg{position:absolute;left:0;bottom:-20px;pointer-events:none}.lp-hero>div{position:relative;z-index:1}
.lp-pill{display:inline-block;padding:5px 14px;border:1px solid rgba(255,255,255,.25);border-radius:99px;font-size:13px;background:rgba(255,255,255,.07)}
.lp h1{font-size:clamp(40px,6vw,78px);line-height:1.04;margin:18px 0}
.lp h1 em{font-style:italic;background:linear-gradient(100deg,#e8c98f,#9fc3a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-sub{font-size:clamp(16px,1.5vw,19px);opacity:.82;max-width:520px;margin:0}.lp-trust{margin-top:22px;font-size:13px;opacity:.6}
.lp-cast{position:relative;width:min(440px,100%);aspect-ratio:1;margin:auto}
.lp-orb{position:absolute;inset:22%;border-radius:50%;display:grid;place-items:center;font-size:clamp(70px,10vw,130px);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.06) 60%);border:1px solid rgba(255,255,255,.3);box-shadow:0 0 70px rgba(185,154,99,.35);animation:bob 8s ease-in-out infinite}
.lp-h{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);font-size:13px;font-weight:700;white-space:nowrap;animation:fin 1s both,bob 6s ease-in-out infinite;animation-delay:calc(var(--i)*.2s),calc(var(--i)*-1.3s)}
.lp-h i{font-style:normal;font-size:21px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#e7d9c3,#cfdccf)}
.lp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 clamp(20px,6vw,90px);margin-top:-56px;position:relative;z-index:2}
.lp-stat{text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px;backdrop-filter:blur(10px)}
.lp-stat b{display:block;font:700 38px Fraunces,serif;color:#e8c98f}.lp-stat span{font-size:13px;opacity:.75}
.lp-sec{padding:84px clamp(20px,6vw,90px) 20px}.lp-sec h2{font-size:clamp(28px,4vw,46px);text-align:center;margin-bottom:10px}
.lp-sec>p{text-align:center;opacity:.7;max-width:560px;margin:0 auto 38px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.lp-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:22px;min-height:168px;transition:.3s}
.lp-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.1)}
.lp-card i{font-style:normal;font-size:30px}.lp-card h3{font-size:18px;margin:10px 0 4px}.lp-card span,.lp-card small{opacity:.72;font-size:14px}
.lp-card.row{display:flex;gap:14px;align-items:center;min-height:0;padding:14px 18px}.lp-card.row b{font-size:15px}
.lp-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.lp-step{padding:24px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.13)}
.lp-step b{font:700 46px Fraunces,serif;color:#e8c98f}.lp-step h3{font-size:20px;margin:4px 0}.lp-step span{opacity:.75;font-size:14px}
.lp-cta{margin:84px clamp(20px,6vw,90px) 60px;padding:58px 24px;text-align:center;border-radius:28px;background:var(--grad)}
.lp-cta h2{font-size:clamp(28px,4vw,44px)}.lp-cta .row{justify-content:center}
.lp footer{padding:26px clamp(20px,6vw,90px);display:flex;gap:12px;align-items:center;border-top:1px solid rgba(255,255,255,.1);opacity:.75;font-size:13px;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s}.rv.in{opacity:1;transform:none}
@media(max-width:860px){.lp-hero{grid-template-columns:1fr;padding-top:36px}.lp-nav a{display:none}.lp-stats{grid-template-columns:1fr;margin-top:-40px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
.mdl{position:fixed;inset:0;background:rgba(10,6,8,.55);backdrop-filter:blur(4px);place-items:center;z-index:50;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(460px,100%);animation:fin .25s}
.btn svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}#toast{z-index:60}
.au-bg{position:fixed;left:0;bottom:0;z-index:-1;pointer-events:none}
.au{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;min-height:calc(100vh - 170px)}.au.reg{grid-template-columns:.8fr 1.2fr}
.au .auth{margin:0;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.au-brand{display:flex;align-items:center;gap:14px;font:700 clamp(34px,4.6vw,56px) Fraunces,serif;color:var(--ink)}
.aphs{position:relative;height:3.8em;margin-top:22px;font:italic 600 clamp(24px,3vw,38px)/1.2 Fraunces,Georgia,serif;color:var(--ink);max-width:560px}
.aph{position:absolute;left:0;top:0;right:0;opacity:0;animation:aph 24s infinite}.aph:first-child{opacity:1}
@keyframes aph{0%{opacity:0;translate:0 10px}4%,13%{opacity:1;translate:0 0}17%,100%{opacity:0}}
.au-sub{margin-top:14px;color:var(--mute);font-size:14px}
@media(max-width:900px){.au,.au.reg{grid-template-columns:1fr;gap:24px;min-height:0}.aphs{height:5em}}
.lp-orb{inset:14%;background-size:cover;background-position:center;border:3px solid rgba(255,255,255,.55);box-shadow:0 0 80px rgba(185,154,99,.45),0 30px 60px rgba(0,0,0,.4);animation:orbf 7s ease-in-out infinite}
.lp-ring{position:absolute;inset:4%;border-radius:50%;border:1px dashed rgba(255,255,255,.3);animation:spin 40s linear infinite}
.lp-ring:before,.lp-ring:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#e8c98f;box-shadow:0 0 14px #e8c98f}
.lp-ring:before{top:-6px;left:50%}.lp-ring:after{bottom:12%;left:3%;width:8px;height:8px;background:#9fc3a8;box-shadow:0 0 12px #9fc3a8}
.lp-cast:after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:24px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.45),transparent 70%);animation:shad 7s ease-in-out infinite}
@keyframes orbf{50%{translate:0 -18px;rotate:3deg}}@keyframes spin{to{rotate:360deg}}@keyframes shad{50%{transform:scale(.8);opacity:.6}}
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(122,59,73,.45),transparent 55%),radial-gradient(circle at 85% 85%,rgba(var(--ac,122,59,73),.3),transparent 55%)}
.sc-i{position:absolute;left:var(--x);font-size:var(--s);opacity:.2;animation-delay:var(--dl);animation-duration:var(--d);animation-iteration-count:infinite}
.sc-fall{top:-10vh;animation-name:sfall;animation-timing-function:linear}@keyframes sfall{to{transform:translateY(118vh) rotate(300deg)}}
.sc-rise{bottom:-10vh;animation-name:srise;animation-timing-function:linear}@keyframes srise{0%{opacity:0}15%,80%{opacity:.22}100%{transform:translateY(-118vh) translateX(26px);opacity:0}}
.sc-drift{top:var(--y);left:0;animation-name:sdrift;animation-timing-function:linear}@keyframes sdrift{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}
.sc-bob{top:var(--y);animation-name:sbob;animation-timing-function:ease-in-out}@keyframes sbob{50%{translate:0 -24px;rotate:6deg}}
.sc-pulse{top:var(--y);animation-name:spulse;animation-timing-function:ease-in-out}@keyframes spulse{0%,100%{scale:.8;opacity:.1}50%{scale:1.25;opacity:.3}}
.sc-twinkle{top:var(--y);animation-name:stw;animation-timing-function:ease-in-out}@keyframes stw{0%,100%{opacity:.04}50%{opacity:.32}}
.sc-swing{top:0;transform-origin:50% 0;animation-name:ssw;animation-timing-function:ease-in-out;animation-direction:alternate;animation-duration:calc(var(--d)/4);text-align:center}
.sc-swing:before{content:"";display:block;width:1px;height:var(--h);margin:0 auto;background:rgba(255,255,255,.3)}@keyframes ssw{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.win{position:absolute;right:6vw;top:12vh;width:34vw;height:42vh;border:6px solid rgba(255,255,255,.12);border-radius:10px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px)}
.win:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.12) 49.5% 50.5%,transparent 50.5%)}
.desk{position:absolute;left:0;right:0;bottom:0;height:16vh;background:linear-gradient(0deg,rgba(0,0,0,.4),transparent)}
.prn{position:absolute;right:10vw;bottom:5vh;font-size:84px;opacity:.28;animation:sbob 6s ease-in-out infinite}
.card,.stat,details{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(10px)}
@media(max-width:760px){.win{width:60vw}}
.lp .lp-foot{display:block;padding:48px clamp(20px,6vw,90px) 22px;opacity:1;background:rgba(0,0,0,.25);font-size:14px}
.lp-fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:32px}.lp-fb{display:flex;align-items:center;gap:12px;font:700 20px Fraunces,serif}
.lp-foot p{opacity:.7;max-width:380px;margin:12px 0 0}.lp-foot h4{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.lp-foot a{display:block;opacity:.8;cursor:pointer;margin:6px 0}.lp-foot a:hover{opacity:1}
.lp-copy{margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);opacity:.65;font-size:13px;text-align:center}
.appf{text-align:center;padding:18px 16px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}body.landing .appf{display:none}
.au-brand{flex-wrap:wrap;font-size:clamp(30px,3.6vw,46px)}
@media(max-width:760px){.lp-fgrid{grid-template-columns:1fr}}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:10px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.pcard.on{border-color:var(--a);box-shadow:0 0 0 3px rgba(122,59,73,.22)}.pcard.adm{cursor:default}.pcard b{font-size:14.5px}
.ppic{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;font-size:44px;background:linear-gradient(140deg,#e7d9c3,#cfdccf) center/cover}
.pill.inoffice,.pill.onduty,.pill.returned{background:#d8e8dc;color:#2f5a3d}.pill.borrowed{background:#f3e6c8;color:#6b531c}.mono{font-variant-numeric:tabular-nums}
.herob{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.hclk{text-align:right;padding-left:24px;border-left:1px solid rgba(255,255,255,.35)}
.hclk b{display:block;font:700 clamp(34px,5vw,56px) Fraunces,serif;line-height:1}.hclk b i{font-style:normal;font-size:.38em;font-weight:600;opacity:.75;margin-left:4px}
.hclk span{display:block;margin-top:8px;opacity:.85;font-size:14px;letter-spacing:.04em}

 return '<div class="card"><h3>Requests Inbox</h3><div class="tbl"><table><tr><th>Type</th><th>ID number</th><th>Details</th><th>Status</th></tr>'+(r.map(function(q){var x=q[2];return '<tr><td>'+q[1]+'</td><td>'+esc(x.sid)+'</td><td>'+q[3]+'</td><td><select aria-label="Status" onchange="setSt(\''+q[0]+'\','+x.id+',this.value)">'+['pending','processing','ready','rejected'].map(function(o){return '<option'+(x.status===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select></td></tr>'}).join('')||'<tr><td colspan="4" class="mute">Nothing yet. New requests will show up here.</td></tr>')+'</table></div></div>'},

function facRows(q){q=(q||'').toLowerCase();var l=db.fac.filter(function(f){return (f.name+f.dept).toLowerCase().indexOf(q)>-1});var t=$('#ftb');if(t)t.innerHTML=l.map(function(f){return '<tr><td><b>'+esc(f.name)+'</b></td><td>'+esc(f.dept)+'</td><td>'+pill(f.st)+'</td><td>'+esc(f.note)+'</td></tr>'}).join('')||'<tr><td colspan="4" class="mute">No faculty match that search.</td></tr>'}

function subC(){var id=$('#c_id').value,s=$('#c_sub').value.trim(),b=$('#c_body').value.trim();if(!okId(id))return toast('Enter a valid ID number');if(!s||!b)return toast('Add a subject and your concern');db.concerns.push({id:++seq,sid:id.trim(),subject:s,body:b,status:'pending'});toast('Your Concern has been submitted');render()}
function subD(){var id=$('#d_id').value;if(!okId(id))return toast('Enter a valid ID number');if(!selDoc)return toast('Choose a document');db.docs.push({id:++seq,sid:id.trim(),doc:selDoc,copies:$('#d_copies').value,purpose:$('#d_purpose').value,status:'pending'});selDoc='';toast('Document request submitted');render()}

function setSt(k,id,v){db[k].forEach(function(x){if(x.id===id)x.status=v});toast('Status updated');render()}
function togP(){db.printOpen=!db.printOpen;render()}
function togO(g,k){db[g][k]=!db[g][k];render()}
function togS(id){db.shirts.forEach(function(s){if(s.id===id)s.on=!s.on});render()}
function delS(id){db.shirts=db.shirts.filter(function(s){return s.id!==id});render()}
function addS(){var n=$('#s_n').value.trim();if(!n)return toast('Enter a shirt name');db.shirts.push({id:++seq,n:n,on:true});toast('Added to catalog');render()}
function addA(){var t=$('#a_t').value.trim(),b=$('#a_b').value.trim();if(!t||!b)return toast('Add a title and message');db.ann.push({id:++seq,title:t,body:b,pin:$('#a_p').checked});toast('Published');render()}
function pinA(id){db.ann.forEach(function(a){if(a.id===id)a.pin=!a.pin});render()}
function delA(id){db.ann=db.ann.filter(function(a){return a.id!==id});render()}
function upF(id,k,v){db.fac.forEach(function(f){if(f.id===id)f[k]=v});toast('Faculty board updated')}
function delF(id){db.fac=db.fac.filter(function(f){return f.id!==id});render()}
function addF(){var n=$('#f_n').value.trim();if(!n)return toast('Enter a name');db.fac.push({id:++seq,name:n,dept:$('#f_d').value.trim()||'General',st:'Available',note:''});toast('Faculty added');render()}
/* chatbot */
function say(t,c){var m=document.createElement('div');m.className='m '+c;m.textContent=t;$('#msgs').appendChild(m);$('#msgs').scrollTop=9e9}
function togBot(){var b=$('#botBox');b.classList.toggle('show');if(!$('#msgs').children.length){say('Hi, I am Tambi. Tap a question or type your own. I answer from a fixed list, so I am not AI.','b');$('#qs').innerHTML=BOT.map(function(q,i){return '<button class="pick" onclick="reply('+i+')">'+q[0]+'</button> '}).join('')}}
function reply(i){say(BOT[i][0],'u');say(BOT[i][2],'b')}
function ask(){var v=$('#botQ').value.trim().toLowerCase();if(!v)return;$('#botQ').value='';say(v,'u');var best=-1,sc=0;BOT.forEach(function(q,i){var s=0;q[1].split(' ').forEach(function(k){if(v.indexOf(k)>-1)s++});if(s>sc){sc=s;best=i}});say(best>-1?BOT[best][2]:'I do not have an answer for that yet. Try one of the questions above, or send a concern through the Student Concerns page.','b')}

function nowS(){return new Date().toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function fd(s){return s?new Date(s+'T00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'-'}
function fdt(s){return s?new Date(s).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-'}
function nowL(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
